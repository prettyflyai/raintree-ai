auto-fit,minmax(240px,1fr));gap:28px\">\n      <label style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4B5078\">Bookings target ($M)<\u002Fspan>\n        <input type=\"number\" step=\"0.1\" value=\"{{ targetStr }}\" sc-camel-on-change=\"{{ onTarget }}\" style=\"font-family:'Outfit',sans-serif;font-size:40px;font-weight:600;color:#00007E;border:1px solid #DADCEB;border-radius:8px;padding:8px 14px;width:100%;box-sizing:border-box;outline:none\">\n      <\u002Flabel>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4B5078\">What to solve for<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"text-align:left;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;padding:12px 14px;border-radius:8px;cursor:pointer;border:1px solid {{ m.border }};background:{{ m.bg }};color:{{ m.color }}\">{{ m.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isConv }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4B5078\">SQL → Win assumption<\u002Fspan>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n            <sc-for list=\"{{ presets }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ p.onClick }}\" style=\"display:flex;flex-direction:column;gap:2px;text-align:left;font-family:'DM Sans',sans-serif;padding:10px 12px;border-radius:8px;cursor:pointer;border:1px solid {{ p.border }};background:{{ p.bg }};color:{{ p.color }}\"><span style=\"font-family:'DM Mono',monospace;font-size:18px;font-weight:500\">{{ p.val }}<\u002Fspan><span style=\"font-size:12px\">{{ p.label }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ isCustom }}\" hint-placeholder-val=\"{{ false }}\">\n            <input type=\"number\" step=\"0.5\" value=\"{{ customWrStr }}\" sc-camel-on-change=\"{{ onCustomWr }}\" style=\"font-family:'DM Mono',monospace;font-size:18px;border:1px solid #DADCEB;border-radius:8px;padding:8px 12px;outline:none\">\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isVol }}\" hint-placeholder-val=\"{{ false }}\">\n        <label style=\"display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4B5078\">MQLs per year (held)<\u002Fspan>\n          <input type=\"number\" step=\"1\" value=\"{{ mqlVolStr }}\" sc-camel-on-change=\"{{ onMqlVol }}\" style=\"font-family:'Outfit',sans-serif;font-size:40px;font-weight:600;color:#00007E;border:1px solid #DADCEB;border-radius:8px;padding:8px 14px;width:100%;box-sizing:border-box;outline:none\">\n          <span style=\"font-size:13px;color:#4B5078\">354 = prior plan (~8 a week, team-wide)<\u002Fspan>\n        <\u002Flabel>\n      <\u002Fsc-if>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start\">\n        <label style=\"display:flex;flex-direction:column;gap:6px;grid-column:1 / -1\"><span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4B5078\">Lead → MQL %<\u002Fspan><input type=\"number\" value=\"{{ l2mStr }}\" sc-camel-on-change=\"{{ onL2m }}\" style=\"font-family:'DM Mono',monospace;font-size:18px;border:1px solid #DADCEB;border-radius:8px;padding:8px 12px;outline:none\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4B5078\">Core SDRs<\u002Fspan><input type=\"number\" value=\"{{ coreSdrStr }}\" sc-camel-on-change=\"{{ onCoreSdr }}\" style=\"font-family:'DM Mono',monospace;font-size:18px;border:1px solid #DADCEB;border-radius:8px;padding:8px 12px;outline:none;width:100%;box-sizing:border-box\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4B5078\">Ent. SDRs<\u002Fspan><input type=\"number\" value=\"{{ entSdrStr }}\" sc-camel-on-change=\"{{ onEntSdr }}\" style=\"font-family:'DM Mono',monospace;font-size:18px;border:1px solid #DADCEB;border-radius:8px;padding:8px 12px;outline:none;width:100%;box-sizing:border-box\"><\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px\">\n      <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"6\">\n        <div style=\"background:{{ k.bg }};color:{{ k.color }};border:1px solid #DADCEB;border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.8\">{{ k.label }}<\u002Fspan>\n          <span style=\"font-family:'Outfit',sans-serif;font-size:40px;font-weight:600;line-height:1.05\">{{ k.val }}<\u002Fspan>\n          <span style=\"font-size:13px;opacity:0.85\">{{ k.sub }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background:#FFFFFF;border:1px solid #DADCEB;border-radius:16px;padding:20px 28px;display:flex;gap:16px;align-items:flex-start\">\n      <span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:{{ verdictColor }};padding-top:4px;white-space:nowrap\">Read-out<\u002Fspan>\n      <p style=\"margin:0;font-size:17px;line-height:1.55;text-wrap:pretty\">{{ verdict }}<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:#FFFFFF;border:1px solid #DADCEB;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px;overflow-x:auto\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap\"><h2 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:24px;font-weight:600\">By segment<\u002Fh2><span style=\"font-size:13px;color:#4B5078\">Segment mix and ACVs held from the $7.38M plan<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.5fr repeat(8,minmax(80px,1fr));font-size:15px;min-width:900px\">\n        <span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px\">Segment<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">Bookings<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">ACV<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">Wins<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">SQL→Win<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">SQLs<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">MQL→SQL<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">MQLs<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">Lead time<\u002Fspan>\n        <sc-for list=\"{{ segRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <span style=\"padding:12px;border-bottom:1px solid #DADCEB;font-weight:{{ r.w }};color:#00007E;background:{{ r.bg }}\">{{ r.name }}<\u002Fspan><span style=\"padding:12px;border-bottom:1px solid #DADCEB;text-align:right;font-family:'DM Mono',monospace;font-weight:{{ r.w }};background:{{ r.bg }}\">{{ r.quota }}<\u002Fspan><span style=\"padding:12px;border-bottom:1px solid #DADCEB;text-align:right;font-family:'DM Mono',monospace;background:{{ r.bg }}\">{{ r.acv }}<\u002Fspan><span style=\"padding:12px;border-bottom:1px solid #DADCEB;text-align:right;font-family:'DM Mono',monospace;font-weight:{{ r.w }};background:{{ r.bg }}\">{{ r.wins }}<\u002Fspan><span style=\"padding:12px;border-bottom:1px solid #DADCEB;text-align:right;font-family:'DM Mono',monospace;background:{{ r.bg }}\">{{ r.wr }}<\u002Fspan><span style=\"padding:12px;border-bottom:1px solid #DADCEB;text-align:right;font-family:'DM Mono',monospace;font-weight:{{ r.w }};background:{{ r.bg }}\">{{ r.sql }}<\u002Fspan><span style=\"padding:12px;border-bottom:1px solid #DADCEB;text-align:right;font-family:'DM Mono',monospace;background:{{ r.bg }}\">{{ r.m2s }}<\u002Fspan><span style=\"padding:12px;border-bottom:1px solid #DADCEB;text-align:right;font-family:'DM Mono',monospace;font-weight:{{ r.w }};background:{{ r.bg }}\">{{ r.mql }}<\u002Fspan><span style=\"padding:12px;border-bottom:1px solid #DADCEB;text-align:right;font-family:'DM Mono',monospace;color:#4B5078;background:{{ r.bg }}\">{{ r.lead }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#FFFFFF;border:1px solid #DADCEB;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px;overflow-x:auto\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap\"><h2 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:24px;font-weight:600\">When the MQLs have to be created<\u002Fh2><span style=\"font-size:13px;color:#4B5078\">Bookings 15 / 25 / 25 / 35 · shifted back by each segment's cycle · 11.25 selling weeks a quarter<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.6fr repeat(6,minmax(80px,1fr));font-size:15px;min-width:900px\">\n        <span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px\">MQLs created in<\u002Fspan>\n        <sc-for list=\"{{ qHeads }}\" as=\"h\" hint-placeholder-count=\"6\"><span style=\"padding:10px 12px;background:{{ h.bg }};color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">{{ h.label }}<\u002Fspan><\u002Fsc-for>\n        <sc-for list=\"{{ qRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <span style=\"padding:12px;border-bottom:1px solid #DADCEB;font-weight:{{ r.w }};color:#00007E;background:{{ r.bg }}\">{{ r.name }}<\u002Fspan>\n          <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"6\"><span style=\"padding:12px;border-bottom:1px solid #DADCEB;text-align:right;font-family:'DM Mono',monospace;font-weight:{{ r.w }};color:{{ c.color }};background:{{ c.bg }}\">{{ c.v }}<\u002Fspan><\u002Fsc-for>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:14px;line-height:1.5;color:#4B5078\">Shaded columns are already past. Large-deal MQLs that should have been created then either exist in pipeline today or have to be made up in Q4 ’26. Excludes MQLs Q4 ’27 creates for 2028.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:#FFFFFF;border:1px solid #DADCEB;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:20px;overflow-x:auto\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap\"><h2 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:24px;font-weight:600\">Expected capacity from the ramp schedule<\u002Fh2><span style=\"font-size:13px;color:#4B5078\">Full quota carried · ramping AEs move linearly from January productivity to 100% in their ramp-end month<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px\">\n        <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4B5078\">Jan productivity, ramping %<\u002Fspan><input type=\"number\" value=\"{{ p0Str }}\" sc-camel-on-change=\"{{ onP0 }}\" style=\"font-family:'DM Mono',monospace;font-size:16px;border:1px solid #DADCEB;border-radius:8px;padding:8px 10px;outline:none;width:100%;box-sizing:border-box\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4B5078\">Core attainment %<\u002Fspan><input type=\"number\" value=\"{{ coreAttStr }}\" sc-camel-on-change=\"{{ onCoreAtt }}\" style=\"font-family:'DM Mono',monospace;font-size:16px;border:1px solid #DADCEB;border-radius:8px;padding:8px 10px;outline:none;width:100%;box-sizing:border-box\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4B5078\">Ent. AE attainment %<\u002Fspan><input type=\"number\" value=\"{{ entAttStr }}\" sc-camel-on-change=\"{{ onEntAtt }}\" style=\"font-family:'DM Mono',monospace;font-size:16px;border:1px solid #DADCEB;border-radius:8px;padding:8px 10px;outline:none;width:100%;box-sizing:border-box\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#4B5078\">Attrition drag by Dec %<\u002Fspan><input type=\"number\" value=\"{{ dragStr }}\" sc-camel-on-change=\"{{ onDrag }}\" style=\"font-family:'DM Mono',monospace;font-size:16px;border:1px solid #DADCEB;border-radius:8px;padding:8px 10px;outline:none;width:100%;box-sizing:border-box\"><\u002Flabel>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.8fr 0.6fr 1.1fr 1fr 0.8fr 1fr 0.9fr;font-size:15px;min-width:900px\">\n        <span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px\">AE group<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px\">HC<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px\">Ramp complete<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">Quota<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">Attain.<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">Capacity<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">Ramp factor<\u002Fspan>\n        <sc-for list=\"{{ aeRows }}\" as=\"a\" hint-placeholder-count=\"4\">\n          <span style=\"padding:10px 12px;border-bottom:1px solid #DADCEB;font-weight:600;color:#00007E\">{{ a.name }}<\u002Fspan>\n          <span style=\"padding:10px 12px;border-bottom:1px solid #DADCEB\"><input type=\"number\" value=\"{{ a.hcStr }}\" sc-camel-on-change=\"{{ a.onHc }}\" style=\"font-family:'DM Mono',monospace;font-size:16px;border:1px solid #DADCEB;border-radius:8px;padding:8px 10px;outline:none;width:100%;box-sizing:border-box;padding:4px 8px;font-size:15px;max-width:64px\"><\u002Fspan>\n          <span style=\"padding:10px 12px;border-bottom:1px solid #DADCEB\"><sc-raw-select value=\"{{ a.doneStr }}\" sc-camel-on-change=\"{{ a.onDone }}\" style=\"font-family:'DM Sans',sans-serif;font-size:14px;border:1px solid #DADCEB;border-radius:6px;padding:4px 8px;background:#FFFFFF\"><option value=\"0\">Fully ramped<\u002Foption><option value=\"2\">End of Feb<\u002Foption><option value=\"3\">End of Mar<\u002Foption><option value=\"4\">End of Apr<\u002Foption><option value=\"5\">End of May<\u002Foption><option value=\"6\">End of Jun<\u002Foption><\u002Fsc-raw-select><\u002Fspan>\n          <span style=\"padding:10px 12px;border-bottom:1px solid #DADCEB;text-align:right;font-family:'DM Mono',monospace\">{{ a.quota }}<\u002Fspan><span style=\"padding:10px 12px;border-bottom:1px solid #DADCEB;text-align:right;font-family:'DM Mono',monospace\">{{ a.att }}<\u002Fspan><span style=\"padding:10px 12px;border-bottom:1px solid #DADCEB;text-align:right;font-family:'DM Mono',monospace;font-weight:500\">{{ a.cap }}<\u002Fspan><span style=\"padding:10px 12px;border-bottom:1px solid #DADCEB;text-align:right;font-family:'DM Mono',monospace;color:#4B5078\">{{ a.rf }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:'Outfit',sans-serif;font-size:28px;font-weight:600\">\n        <span style=\"padding:12px 18px;border:1px solid #DADCEB;border-radius:8px\">{{ bLoaded }} <span style=\"font-family:'DM Sans',sans-serif;font-size:13px;font-weight:400;color:#4B5078\">quota<\u002Fspan><\u002Fspan><span style=\"color:#00007E\">×<\u002Fspan>\n        <span style=\"padding:12px 18px;border:1px solid #DADCEB;border-radius:8px\">{{ bAtt }} <span style=\"font-family:'DM Sans',sans-serif;font-size:13px;font-weight:400;color:#4B5078\">attainment<\u002Fspan><\u002Fspan><span style=\"color:#00007E\">×<\u002Fspan>\n        <span style=\"padding:12px 18px;border:1px solid #DADCEB;border-radius:8px\">{{ bRamp }} <span style=\"font-family:'DM Sans',sans-serif;font-size:13px;font-weight:400;color:#4B5078\">ramp &amp; attrition<\u002Fspan><\u002Fspan><span style=\"color:#00007E\">=<\u002Fspan>\n        <span style=\"padding:12px 18px;border-radius:8px;background:#00007E;color:#FFFFFF\">{{ bCap }} <span style=\"font-family:'DM Sans',sans-serif;font-size:13px;font-weight:400;color:#DCDEF8\">{{ bCapPct }}<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.6fr repeat(5,minmax(90px,1fr));font-size:15px;min-width:760px\">\n        <span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px\"><\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">Q1 ’27<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">Q2 ’27<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">Q3 ’27<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">Q4 ’27<\u002Fspan><span style=\"padding:10px 12px;background:#00007E;color:#FFFFFF;font-weight:700;font-size:13px;text-align:right\">FY27<\u002Fspan>\n        <sc-for list=\"{{ capQRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <span style=\"padding:10px 12px;border-bottom:1px solid #DADCEB;font-weight:{{ r.w }};color:#00007E\">{{ r.name }}<\u002Fspan>\n          <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"5\"><span style=\"padding:10px 12px;border-bottom:1px solid #DADCEB;text-align:right;font-family:'DM Mono',monospace;font-weight:{{ r.w }}\">{{ c }}<\u002Fspan><\u002Fsc-for>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#FFFFFF;border:1px solid #DADCEB;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap\"><h2 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:24px;font-weight:600\">Win rate decides the MQL target<\u002Fh2><span style=\"font-size:13px;color:#4B5078\">MQLs needed for {{ targetLabel }} at each SQL→Win rate<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px\">\n        <sc-for list=\"{{ sens }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <div style=\"border:1px solid {{ s.border }};background:{{ s.bg }};border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-family:'DM Mono',monospace;font-size:13px;color:#4B5078\">{{ s.label }}<\u002Fspan>\n            <span style=\"font-family:'Outfit',sans-serif;font-size:32px;font-weight:600;color:#00007E\">{{ s.mql }} MQLs<\u002Fspan>\n            <span style=\"font-size:13px;color:#4B5078\">{{ s.sub }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px\">\n      <div style=\"background:#FFFFFF;border:1px solid #DADCEB;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#00007E\">Full quota<\u002Fspan><span style=\"font-size:15px;line-height:1.5\">Ramping AEs carry full quota, so {{ targetLabel }} is the bookings target and the quarterly phasing stands. The 83.4% ramp factor reduces expected output, not quota.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:1px solid #DADCEB;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#00007E\">One capacity number<\u002Fspan><span style=\"font-size:15px;line-height:1.5\">Capacity is now built from the actual ramp schedule above. It replaces Pigment ($5.238M), the AE bridge ($5.00M) and the $7.68M ramped-quota figure.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:1px solid #DADCEB;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#A1440A\">Real historical win rate · to pull<\u002Fspan><span style=\"font-size:15px;line-height:1.5\">The 9.2% is the playbook's 43 wins ÷ 468 SALs, which is SAL→Won, not SQL→Win. Pull from Salesforce: new-logo opportunities created in 2024–25 that reached the SQL stage, closed outcomes only, Closed Won ÷ (Won + Lost), by segment. Enter it under Salesforce actual.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:1px solid #DADCEB;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#00007E\">SDR ownership<\u002Fspan><span style=\"font-size:15px;line-height:1.5\">Core SDRs own Enterprise and Non-Enterprise MQLs; the Enterprise SDR owns Super Enterprise. Targets are set per SDR, not as a team average.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { target: '8.6', mode: 'conv', preset: 'plan', customWr: '12', mqlVol: '354', l2m: '33', coreSdr: '3', entSdr: '1',\n    p0: '50', coreAtt: '70', entAtt: '80', drag: '0',\n    aes: [\n      { name: 'Core AE · ramped', hc: '2', done: '0', type: 'core' },\n      { name: 'Core AE · ramp ends Mar', hc: '2', done: '3', type: 'core' },\n      { name: 'Core AE · ramp ends Apr', hc: '1', done: '4', type: 'core' },\n      { name: 'Enterprise AE', hc: '1', done: '0', type: 'ent' }\n    ] };\n  renderVals() {\n    const S = this.state, num = (v, d) => { const n = parseFloat(v); return isFinite(n) && n >= 0 ? n : d; };\n    const T = (num(S.target, 8.6) || 8.6) * 1e6, l2m = (num(S.l2m, 33) || 33) / 100, cs = num(S.coreSdr, 3) || 1, es = num(S.entSdr, 1) || 1;\n    const f0 = v => Math.round(v).toLocaleString('en-US'), f1 = v => v.toFixed(1), pct = v => (v * 100).toFixed(1) + '%';\n    const fM = v => '$' + (v / 1e6).toFixed(2) + 'M', fK = v => v >= 1e6 ? '$' + (v / 1e6).toFixed(2) + 'M' : '$' + Math.round(v / 1000) + 'K';\n    const set = o => () => this.setState(o);\n    const btn = on => ({ bg: on ? '#00007E' : '#FFFFFF', color: on ? '#FFFFFF' : '#12163F', border: on ? '#00007E' : '#DADCEB' });\n    const W = [0.15, 0.25, 0.25, 0.35];\n\n    // capacity from ramp schedule\n    const p0 = num(S.p0, 50) / 100, drag = num(S.drag, 0) / 100;\n    const QUOTA = { core: 1.2e6, ent: 2.6e6 }, ATT = { core: num(S.coreAtt, 70) / 100, ent: num(S.entAtt, 80) / 100 };\n    const prod = (m, d) => (d <= 1 || m + 1 >= d) ? 1 : p0 + (1 - p0) * m / (d - 1);\n    const capM = Array(12).fill(0); let loaded = 0, attained = 0;\n    const aeRows = S.aes.map((a, i) => {\n      const hc = num(a.hc, 0), d = num(a.done, 0), full = QUOTA[a.type] / 12 * ATT[a.type];\n      let c = 0; for (let m = 0; m < 12; m++) { const v = hc * full * prod(m, d) * (1 - drag * m / 12); capM[m] += v; c += v; }\n      loaded += hc * QUOTA[a.type]; attained += hc * QUOTA[a.type] * ATT[a.type];\n      const upd = (k) => e => { const v = e.target.value; this.setState(s => ({ aes: s.aes.map((x, j) => j === i ? { ...x, [k]: v } : x) })); };\n      return { name: a.name, hcStr: a.hc, doneStr: a.done, onHc: upd('hc'), onDone: upd('done'), quota: fM(hc * QUOTA[a.type]), att: Math.round(ATT[a.type] * 100) + '%', cap: fM(c), rf: pct(hc ? c / (hc * QUOTA[a.type] * ATT[a.type]) : 0) };\n    });\n    const cap = capM.reduce((a, b) => a + b, 0), attPct = attained / loaded, rampF = cap / attained;\n    const capQ = [0, 1, 2, 3].map(q => capM[q * 3] + capM[q * 3 + 1] + capM[q * 3 + 2]);\n    const capQRows = [\n      { name: 'Quota bookings', w: 600, cells: W.map(w => fM(T * w)).concat([fM(T)]) },\n      { name: 'Expected capacity', w: 400, cells: capQ.map(fM).concat([fM(cap)]) },\n      { name: 'Coverage', w: 600, cells: capQ.map((c, q) => Math.round(c / (T * W[q]) * 100) + '%').concat([Math.round(cap / T * 100) + '%']) },\n      { name: 'Gap', w: 400, cells: capQ.map((c, q) => fM(T * W[q] - c)).concat([fM(T - cap)]) }\n    ];\n\n    const segs = [\n      { name: 'Super Enterprise', acv: 1512000, mix: 2003000 / 8.6e6, m2s: 0.80, lead: 3 },\n      { name: 'Enterprise', acv: 420000, mix: 3234000 / 8.6e6, m2s: 0.75, lead: 2 },\n      { name: 'Non-Enterprise', acv: 92400, mix: 3363000 / 8.6e6, m2s: 0.67, lead: 1 }\n    ];\n    const winsFor = s => T * s.mix / s.acv;\n    const totWins = segs.reduce((a, s) => a + winsFor(s), 0), blendACV = T / totWins;\n    const mqlAt = wr => segs.reduce((a, s) => a + winsFor(s) / wr / s.m2s, 0);\n    const capImplied = (cap / blendACV) / (totWins / 0.15);\n    const PLAYBOOK = 43 / 468;\n    const presetWr = { plan: 0.15, cap: capImplied, hist: PLAYBOOK, custom: (num(S.customWr, 12) || 12) / 100 };\n    const isConv = S.mode === 'conv';\n    let wr, mqlBySeg;\n    if (isConv) { wr = presetWr[S.preset]; mqlBySeg = segs.map(s => winsFor(s) / wr / s.m2s); }\n    else {\n      const V = num(S.mqlVol, 354) || 354, base = segs.map(s => winsFor(s) / s.m2s), bt = base.reduce((a, b) => a + b, 0);\n      mqlBySeg = base.map(b => V * b / bt); wr = totWins / mqlBySeg.reduce((a, m, i) => a + m * segs[i].m2s, 0);\n    }\n    const sqlBySeg = mqlBySeg.map((m, i) => m * segs[i].m2s);\n    const totMql = mqlBySeg.reduce((a, b) => a + b, 0), totSql = sqlBySeg.reduce((a, b) => a + b, 0), leads = totMql / l2m;\n    const coreMql = mqlBySeg[1] + mqlBySeg[2], entMql = mqlBySeg[0];\n    const qLabels = ['Q2 ’26', 'Q3 ’26', 'Q4 ’26', 'Q1 ’27', 'Q2 ’27', 'Q3 ’27'];\n    const grid = segs.map((s, i) => { const row = [0, 0, 0, 0, 0, 0]; W.forEach((w, q) => { row[q + 3 - s.lead] += mqlBySeg[i] * w; }); return row; });\n    const past = q => q < 2, idx = [0, 1, 2, 3, 4, 5];\n    const tot = idx.map(q => grid.reduce((a, r) => a + r[q], 0));\n    const corePw = idx.map(q => (grid[1][q] + grid[2][q]) / 11.25 / cs), entPw = idx.map(q => grid[0][q] / 11.25 / es);\n    const peakCore = Math.max(...corePw.slice(2));\n    const mkRow = (name, vals, w, fmt, hi, bg) => ({ name, w, bg: bg || '#FFFFFF', cells: vals.map((v, q) => ({ v: v === 0 ? '—' : fmt(v), bg: past(q) ? '#F4F5FB' : (bg || '#FFFFFF'), color: past(q) ? '#8A8FB0' : (hi && v === peakCore ? '#A1440A' : '#12163F') })) });\n    const qRows = [mkRow('Super Enterprise', grid[0], 400, f0), mkRow('Enterprise', grid[1], 400, f0), mkRow('Non-Enterprise', grid[2], 400, f0),\n      mkRow('Total MQLs', tot, 700, f0, null, '#EEF0FB'), mkRow('Per Core SDR / week', corePw, 600, f1, true), mkRow('Per Ent. SDR / week', entPw, 600, v => v.toFixed(2))];\n    const presetList = [['plan', 'Plan', 0.15], ['cap', 'Capacity-implied', capImplied], ['hist', 'Playbook SAL→Won · unverified', PLAYBOOK], ['custom', 'Salesforce actual', presetWr.custom]];\n    let verdict, verdictColor = '#00007E';\n    if (isConv) {\n      verdict = `To book ${fM(T)} at a ${pct(wr)} SQL→Win rate you need ${f0(totMql)} MQLs a year: about ${f1(coreMql / 45 / cs)} a week per Core SDR and ${f1(entMql / 45 / es)} for the Enterprise SDR, peaking at ${f1(peakCore)} per Core SDR. Expected AE capacity is ${fM(cap)} (${Math.round(cap / T * 100)}% of target).`;\n    } else {\n      verdict = `Holding ${f0(totMql)} MQLs, the team must close ${pct(wr)} of SQLs to book ${fM(T)}. ` + (wr > 0.15 ? 'That is above the 15% plan rate, so the target leans on a win-rate lift.' : 'That is within the 15% plan rate.');\n      verdictColor = wr > 0.15 ? '#A1440A' : '#127A4B';\n    }\n    const sensRates = [PLAYBOOK, capImplied, 0.12, 0.15, 0.187];\n    const sensLabels = [pct(PLAYBOOK) + ' · playbook, unverified', pct(capImplied) + ' · capacity-implied', '12% · improvement', '15% · plan', '18.7% · prior-plan volume'];\n    const sens = sensRates.map((r, i) => { const m = mqlAt(r), on = Math.abs(r - wr) < 0.001; return { label: sensLabels[i], mql: f0(m), sub: `${f1(m * (coreMql / totMql) / 45 / cs)} per Core SDR / wk · ${f0(m / l2m)} leads`, bg: on ? '#EEF0FB' : '#FFFFFF', border: on ? '#00007E' : '#DADCEB' }; });\n    return {\n      targetStr: S.target, onTarget: e => this.setState({ target: e.target.value }),\n      mqlVolStr: S.mqlVol, onMqlVol: e => this.setState({ mqlVol: e.target.value }),\n      customWrStr: S.customWr, onCustomWr: e => this.setState({ customWr: e.target.value }),\n      l2mStr: S.l2m, onL2m: e => this.setState({ l2m: e.target.value }),\n      coreSdrStr: S.coreSdr, onCoreSdr: e => this.setState({ coreSdr: e.target.value }),\n      entSdrStr: S.entSdr, onEntSdr: e => this.setState({ entSdr: e.target.value }),\n      p0Str: S.p0, onP0: e => this.setState({ p0: e.target.value }),\n      coreAttStr: S.coreAtt, onCoreAtt: e => this.setState({ coreAtt: e.target.value }),\n      entAttStr: S.entAtt, onEntAtt: e => this.setState({ entAtt: e.target.value }),\n      dragStr: S.drag, onDrag: e => this.setState({ drag: e.target.value }),\n      aeRows, capQRows, bLoaded: fM(loaded), bAtt: pct(attPct), bRamp: pct(rampF), bCap: fM(cap), bCapPct: Math.round(cap / T * 100) + '% of target',\n      isConv, isVol: !isConv, isCustom: isConv && S.preset === 'custom',\n      modes: [{ k: 'conv', label: 'Hold conversion rates → solve MQLs' }, { k: 'vol', label: 'Hold MQL volume → solve win rate' }].map(m => ({ ...m, ...btn(S.mode === m.k), onClick: set({ mode: m.k }) })),\n      presets: presetList.map(([k, label, v]) => ({ label, val: pct(v), ...btn(S.preset === k), onClick: set({ preset: k }) })),\n      kpis: [\n        { label: 'Wins', val: f1(totWins), sub: 'Blended ACV ' + fK(blendACV), bg: '#00007E', color: '#FFFFFF' },\n        { label: 'SQL → Win', val: pct(wr), sub: isConv ? 'Assumption' : 'Required', bg: '#FFFFFF', color: wr > 0.15 ? '#A1440A' : '#12163F' },\n        { label: 'SQLs', val: f0(totSql), sub: 'Pipeline ' + fM(T / wr) + ' · ' + (1 / wr).toFixed(1) + '× coverage', bg: '#FFFFFF', color: '#12163F' },\n        { label: 'MQLs', val: f0(totMql), sub: f1(totMql / 45) + ' a week, team-wide', bg: '#FFFFFF', color: '#12163F' },\n        { label: 'Leads', val: f0(leads), sub: 'At ' + Math.round(l2m * 100) + '% Lead → MQL', bg: '#FFFFFF', color: '#12163F' },\n        { label: 'Per Core SDR / wk', val: f1(coreMql / 45 / cs), sub: 'Peak ' + f1(peakCore) + ' · Ent. SDR ' + f1(entMql / 45 / es), bg: '#EEF0FB', color: '#00007E' }\n      ],\n      verdict, verdictColor, targetLabel: fM(T),\n      segRows: segs.map((s, i) => ({ name: s.name, quota: fM(T * s.mix), acv: fK(s.acv), wins: f1(winsFor(s)), wr: pct(wr), sql: f0(sqlBySeg[i]), m2s: Math.round(s.m2s * 100) + '%', mql: f0(mqlBySeg[i]), lead: s.lead + (s.lead === 1 ? ' qtr' : ' qtrs'), w: 400, bg: '#FFFFFF' }))\n        .concat([{ name: 'New-logo total', quota: fM(T), acv: fK(blendACV), wins: f1(totWins), wr: pct(wr), sql: f0(totSql), m2s: Math.round(totSql / totMql * 100) + '%', mql: f0(totMql), lead: '—', w: 700, bg: '#EEF0FB' }]),\n      qHeads: qLabels.map((l, q) => ({ label: l, bg: past(q) ? '#5A5F82' : '#00007E' })),\n      qRows, sens\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
